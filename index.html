  else if(ok.includes(d)&&h<8)m=t("st_c")+" "+tf(8);
  else{let x=d;do{x=(x+1)%7}while(!ok.includes(x));m=t("st_c")+" "+wd(x)+", "+tf(8)}
  document.querySelectorAll(".stat").forEach(e=>e.innerHTML=`<span class="sd ${o?"on":"off"}"></span>${m}`);
}
function setTitle(){const a=document.querySelector("#nav a[aria-current]");document.title="La Tablée"+(a?" – "+a.textContent:"")}
function focusHead(){const h=document.querySelector(".page:not([hidden]) h1,.page:not([hidden]) h2");if(h){h.tabIndex=-1;h.focus({preventScroll:true})}}
function draw(){
  document.documentElement.lang=["en","fr","it","zh","ar-MA"][li];
  document.documentElement.dir=RTL[li]?"rtl":"ltr";
  document.querySelectorAll("[data-i18n]").forEach(e=>e.textContent=t(e.dataset.i18n));
  $("table").innerHTML=P.map(([r,g],i)=>`<li class="${first?"a":""}" style="--c:${C[r]};--i:${i}"><span class="pl" dir="auto">${g}</span><small>${t("r_"+r)}</small></li>`).join("");
  $("tabs").innerHTML=Object.keys(M).map(k=>`<button aria-pressed="false" data-k="${k}">${t(k)}</button>`).join("");
  $("lgd").innerHTML=`<b>${t("dlg")}</b>`+["V","VG","H","DF","GF"].map(x=>badge(x)).join("")+`<i class="vg dsh">${t("opt")}</i>`;
  menu();
  $("fnd").innerHTML=F.map(([n,r,d])=>`<li style="--c:${C[r]}"><div class="av" aria-hidden="true">${n[0]}</div><b>${n}</b><small>${t("r_"+r)}</small><small>${t("sig")}: <span dir="auto">${d}</span></small></li>`).join("");
  $("faqs").innerHTML=[1,6,2,3,4,5].map(i=>`<details><summary>${t("q"+i)}</summary><p>${t("a"+i)}</p></details>`).join("");
  $("ok").textContent="";first=0;stat();setTitle();
}
function route(){
  let h=(location.hash||"#home").slice(1);if(!$(h))h="home";
  document.querySelectorAll(".page").forEach(p=>p.hidden=p.id!==h);
  document.querySelectorAll("#nav a").forEach(a=>a.getAttribute("href")==="#"+h?a.setAttribute("aria-current","page"):a.removeAttribute("aria-current"));
  window.scrollTo(0,0);setTitle();if(route.i)focusHead();route.i=1;
}
$("lang").onchange=e=>{li=+e.target.value;draw()};
$("tabs").onclick=e=>{const k=e.target.dataset.k;if(k){cat=k;menu();}};
$("vg").onchange=menu;
{const n=now();$("fd").min=n.getFullYear()+"-"+String(n.getMonth()+1).padStart(2,"0")+"-"+String(n.getDate()).padStart(2,"0")}
document.querySelector(".skip").onclick=e=>{e.preventDefault();focusHead()};
$("cf").onsubmit=e=>{e.preventDefault();const w=new Date($("fd").value+"T12:00").getDay();
  let msg = (w==1||w==2)?t("e_cl"):(+$("fg").value>=5?t("e_gr"):"");
  $("ok").textContent=msg||t("f_ok");
  if(!msg)e.target.reset();
};
addEventListener("hashchange",route);
draw();route();
</script>
